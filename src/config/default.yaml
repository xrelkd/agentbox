# Agentbox configuration.
#
# Written by `agentbox config init`. Run `agentbox config init --full` to write
# the complete template, which documents every setting and all default mounts.
# Omitted fields use built-in defaults. Paths support `~` and `$ENV` expansion.

general:
  # Nix-built AI environment mounted into the container.
  ai_env_path: "~/.local/share/agentbox-env"
  # Prefix for generated container, home, temporary, and metadata names.
  container_prefix: "agentbox"
  # Host base directory containing <uid>-<name>-<hash>/{home,tmp,meta}.
  runtime_base_dir: "/tmp/agentbox"
  # Project directories `start` refuses to use; root is always rejected.
  forbidden_dirs: ["/", "/tmp"]
  # Names searched under <ai_env_path>/bin.
  shell: "zsh"
  default_agent: "shell"
  ocelot_path: "ocelot"
  podman_binary: "podman"

container:
  workdir: "/workspace"
  read_only: true
  memory_limit: "12g"
  cpus: "2"

nix:
  enable_daemon_mount: true
  store_path: "/nix/store"
  host_config_dir: "~/.config/nix"
  host_cache_dir: "~/.cache/nix"

# Mounts are read-only unless `read_only: false` is set. Missing host paths are
# skipped with a warning. Add more entries here for your own tools.
mounts:
  - host: "~/.claude"
    container: "~/.claude"
    read_only: true
  - host: "~/.claude/projects"
    container: "~/.claude/projects"
    read_only: false
  - host: "~/.config/opencode"
    container: "~/.config/opencode"
    read_only: false
  - host: "~/.local/state/opencode"
    container: "~/.local/state/opencode"
    read_only: false
  - host: "~/.gemini"
    container: "~/.gemini"
    read_only: true
  - host: "~/.gemini/history"
    container: "~/.gemini/history"
    read_only: false
  - host: "~/.local/bin"
    container: "~/.local/bin"
    read_only: true
  - host: "~/.zshrc"
    container: "~/.zshrc"
    read_only: true

environment:
  path: "~/.local/bin:/run/ai-env/bin:/usr/bin:/bin"
  ssl_cert_file: "/run/ai-env/etc/ssl/certs/ca-bundle.crt"
  lang: "C.UTF-8"
  default_term: "xterm-256color"
  extra_env: {}

secrets:
  base_dir: "~/.config/sops-nix/secrets"
  entries:
    ANTHROPIC_API_KEY: "ai/anthropic-api-key/default"
    GEMINI_API_KEY: "ai/gemini-api-key/default"
    OPENROUTER_API_KEY: "ai/openrouter-api-key/sandbox"

server:
  serve_port: 4096
  serve_host: "127.0.0.1"
  listen_host: "127.0.0.1"
  startup_timeout_secs: 15
  poll_interval_ms: 250

agents:
  opencode:
    command: "opencode"
    serve:
      command: "opencode serve"
      attach: "opencode attach"
  claude:
    command: "claude --resume"
  gemini:
    command: "gemini --resume"
